name: Checks
on:
  pull_request:
    # Le modifiche solo documentali non toccano codice, test o build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
# Un nuovo push sulla stessa PR annulla la verifica precedente ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt
      - run: npm ci
      - run: npm run deploy:check
      - run: npm run lint && npm test && npm run build
      - run: npm run db:migrate && npm run db:seed
      - name: Verify Wrangler builds static assets from a clean checkout
        run: |
          rm -rf dist
          npm run dry-run
      - run: npm run test:integration
      - name: Enabled editorial dashboard with fake APIs, desktop and mobile
        run: |
          python -m pip install -r scripts/browser-requirements.txt
          python -m playwright install --with-deps chromium
          ROS_TEST_BROWSER=1 npm run test:editorial
      - name: Batch lifecycle with fake OpenAI and isolated local budgets
        run: ROS_TEST_BATCH=1 npm run test:integration
      - name: Independent editorial v2 with fake OpenAI and private experimental storage
        run: ROS_TEST_V2=1 npm run test:integration
      - name: Demo gameplay without any R2 bindings
        run: ROS_TEST_PROFILE= npm run test:integration
      - name: REAL discovery atomic reservations with fake model transport
        run: ROS_TEST_REAL=1 npm run test:integration
      - name: Editorial cycle atomic generation budgets with fake model transport
        run: ROS_TEST_CYCLE=1 npm run test:integration
