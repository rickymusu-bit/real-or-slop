name: Checks
on:
  pull_request:
    # Le modifiche solo documentali non toccano codice, test o build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
# Un nuovo push sulla stessa PR annulla la verifica precedente ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - name: Verify Wrangler builds static assets from a clean checkout
        run: |
          rm -rf dist
          npm run dry-run
      - name: Library and game on local D1 and R2, desktop and mobile browser
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm run build
          ROS_TEST_BROWSER=1 npm run test:integration

      - name: Save admin wizard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-preview-v1.7.0
          path: |
            artifacts/library-browser/*.png
            artifacts/wizard-browser/*.png
          if-no-files-found: ignore
