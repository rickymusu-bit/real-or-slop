name: Checks
on:
  pull_request:
    # Le modifiche solo documentali non toccano codice, test o build.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
# Un nuovo push sulla stessa PR annulla la verifica precedente ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and both parents suffice for the base/head diff.
          fetch-depth: 2
      - name: Select affected integration suites
        id: integration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_INTEGRATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/select-integration.mjs
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.integration.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - name: Verify Wrangler builds static assets from a clean checkout
        run: |
          rm -rf dist
          npm run dry-run
      - name: Integration dependencies
        if: steps.integration.outputs.run == 'true'
        run: python -m pip install -r tests/requirements.txt
      - uses: actions/cache@v4
        if: steps.integration.outputs.browser == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/requirements.txt') }}
      - name: Chromium for affected browser tests
        if: steps.integration.outputs.browser == 'true'
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Affected integration and browser tests
        if: steps.integration.outputs.run == 'true'
        env:
          ROS_TEST_SUITES: ${{ steps.integration.outputs.suites }}
          ROS_TEST_BROWSER: ${{ steps.integration.outputs.browser == 'true' && '1' || '0' }}
        run: npm run test:integration

      - name: Save admin wizard previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-preview
          path: |
            artifacts/library-browser/*.png
            artifacts/wizard-browser/*.png
            artifacts/slop-browser/*.png
            artifacts/database-browser/*.png
            artifacts/game-browser/*.png
            artifacts/slop-auto-browser/*.png
            artifacts/integration-timings.json
          if-no-files-found: ignore
