name: Image candidates (manual, no publishing)
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [commons, openverse, met, loc, smithsonian, nasa]
        required: true
        default: commons
# Schedule deliberately inactive until owner configures destination, access and quotas.
# Then add schedule to the trusted default branch; never pull_request_target.
permissions:
  contents: read
jobs:
  collect:
    if: ${{ vars.ENABLE_IMAGE_PIPELINE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Collect metadata to private artifact only
        env:
          PROVIDER: ${{ inputs.provider }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
        run: python -m pipeline.run --config pipeline/search.example.json --provider "$PROVIDER" --live
      - uses: actions/upload-artifact@v4
        with:
          name: private-review-queue
          path: .pipeline/
          retention-days: 7
