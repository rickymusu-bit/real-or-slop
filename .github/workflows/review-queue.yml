name: Automatic private review queue
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  collect-and-import:
    # No PR/fork execution. Activation is a separate owner-controlled setting.
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.private == true && vars.ENABLE_AUTOMATIC_REVIEW_QUEUE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Check importer secret without exposing it
        env:
          REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          if len(os.environ.get('REAL_OR_SLOP_ADMIN_TOKEN', '')) < 32:
              raise SystemExit('Configure the REAL_OR_SLOP_ADMIN_TOKEN Actions secret before enabling this job.')
          PY
      - name: Collect and validate up to ten REAL candidates locally
        run: python -m pipeline.automatic --collect
      - name: Import originals and candidates into the private review queue
        env:
          REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
        run: python -m pipeline.automatic --apply
      - name: Preserve private batch and recovery receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-automatic-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pipeline/automatic/
          retention-days: 7
