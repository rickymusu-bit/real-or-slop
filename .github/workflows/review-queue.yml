name: Import existing private editorial comparison
on:
  workflow_dispatch:
    inputs:
      confirm_import:
        description: 'Import the frozen 20-photo / 10-generation lot without any model calls'
        type: boolean
        default: false
      bundle_sha256:
        description: 'Authorized SHA-256 of the private import bundle'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  import-existing:
    if: ${{ github.ref == 'refs/heads/ops/import-direct-20-2026-11-03' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' && inputs.confirm_import }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLE_EDITORIAL_PAID: 'false'
      REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
      GENERATED_LICENSE_NAME: CC BY 4.0
      GENERATED_LICENSE_URL: https://creativecommons.org/licenses/by/4.0/
      ROS_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Read the existing private transfer for Studio import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/assemble-private-comparison.py
      - name: Verify and import using existing administrative APIs
        run: |
          python -m pipeline.import_comparison .pipeline/import-source/archivio-completo-20.zip --sha256 "$ROS_BUNDLE_SHA256" --execute
      - name: Preserve numeric receipt only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-import-${{ github.run_id }}
          path: .pipeline/imported-direct-20/import-summary.json
          retention-days: 7
