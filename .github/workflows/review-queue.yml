name: Controlled manual Batch pilot
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Start a new lot, advance saved jobs, inspect status, or request cancellation'
        type: choice
        options: ['start', 'resume', 'status', 'cancel', 'permissions']
        default: 'start'
      batch_run_id:
        description: 'Existing run ID for resume/status/cancel (no new collection)'
        type: string
        default: ''
      reference_count:
        description: 'Controlled pilot: maximum two source photographs and one generation'
        type: choice
        options: ['2']
        default: '2'
      execute_paid:
        description: 'Authorize submitting the next bounded Batch stages; false only collects existing results'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  collect-and-import:
    # One explicitly authorized manual pilot; no schedule or repository variable changes.
    if: ${{ github.ref == 'refs/heads/ops/batch-pilot-2026-11-02' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROS_OPERATION: ${{ inputs.operation }}
      ROS_REFERENCE_COUNT: '2'
      ROS_BATCH_RUN_ID: ${{ inputs.batch_run_id }}
      ROS_QUEUE_ENABLED: 'true'
      ROS_EXECUTE_PAID: ${{ inputs.execute_paid && 'true' || 'false' }}
      ENABLE_EDITORIAL_PAID: ${{ inputs.execute_paid && 'true' || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
      OPENAI_ANALYSIS_MODEL: gpt-6.1-terra
      OPENAI_EVALUATOR_MODEL: gpt-6.1-terra
      OPENAI_IMAGE_MODEL: gpt-image-2
      EDITORIAL_RUN_USD: '5'
      EDITORIAL_DAILY_USD: '5'
      EDITORIAL_TOTAL_USD: '5'
      EDITORIAL_BATCH_EVALUATION_USD: '0.50'
      EDITORIAL_BATCH_GENERATION_USD: '2.00'
      EDITORIAL_THRESHOLD: '65'
      EDITORIAL_ATTEMPTS: '1'
      EDITORIAL_MAX_EVALUATIONS: '4'
      EDITORIAL_MAX_GENERATIONS: '1'
      EDITORIAL_MAX_REGENERATIONS: '1'
      EDITORIAL_QUEUE_LIMIT: '100'
      OPENAI_IMAGE_SIZE: 1024x1024
      OPENAI_IMAGE_QUALITY: medium
      GENERATED_LICENSE_NAME: CC BY 4.0
      GENERATED_LICENSE_URL: https://creativecommons.org/licenses/by/4.0/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Check OpenAI permissions without inference
        if: ${{ inputs.operation == 'permissions' }}
        run: |
          python - <<'PYPROBE'
          import os,json,re
          from urllib.request import Request,build_opener
          from urllib.error import HTTPError
          from pipeline.importer import NoRedirect
          key=os.environ.get('OPENAI_API_KEY','')
          if not key:raise SystemExit('OPENAI_API_KEY non configurata')
          boundary='ros-permission-probe'
          file_body=(f'--{boundary}\r\nContent-Disposition: form-data; name="purpose"\r\n\r\nbatch\r\n'
            f'--{boundary}\r\nContent-Disposition: form-data; name="file"; filename="probe.jsonl"\r\nContent-Type: application/jsonl\r\n\r\n{{}}\n\r\n--{boundary}--\r\n').encode()
          probes=[('files?limit=1',None,'application/json'),('files',file_body,'multipart/form-data; boundary='+boundary),('batches?limit=1',None,'application/json'),('batches',b'{}','application/json'),('responses',b'{}','application/json'),('images/generations',b'{}','application/json')]
          for path,data,content_type in probes:
            try:
              req=Request('https://api.openai.com/v1/'+path,data=data,headers={'Authorization':'Bearer '+key,'Content-Type':content_type})
              with build_opener(NoRedirect()).open(req,timeout=30) as response:status=response.status;message=''
            except HTTPError as error:
              status=error.code
              try:message=str(json.loads(error.read(16000)).get('error',{}).get('message',''))
              except ValueError:message=''
            print(json.dumps(dict(endpoint=path,status=status,missing_scopes=sorted(set(re.findall(r'\b(?:api|model)\.[a-z_]+(?:\.[a-z_]+)*',message))),inference_submitted=False)))
          PYPROBE
      - name: Collect or inspect a new bounded lot
        if: ${{ (inputs.operation == 'start' || github.event_name == 'schedule') && env.ROS_QUEUE_ENABLED == 'true' }}
        run: |
          python -m pipeline.automatic --collect --limit "$ROS_REFERENCE_COUNT" --preferences
          python -m pipeline.batch .pipeline/automatic/manifest.json
      - name: Start or resume a private Batch run
        if: ${{ (inputs.operation == 'start' || github.event_name == 'schedule') && env.ROS_QUEUE_ENABLED == 'true' && env.ROS_EXECUTE_PAID == 'true' }}
        run: python -m pipeline.batch .pipeline/automatic/manifest.json --start --execute --run-id "ros-$GITHUB_RUN_ID"
      - name: Manual status, continuation or cancellation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'start' && inputs.operation != 'permissions' }}
        run: |
          if [ -z "$ROS_BATCH_RUN_ID" ]; then echo 'Existing batch_run_id is required'; exit 1; fi
          args=()
          if [ "$ROS_EXECUTE_PAID" = 'true' ]; then args+=(--execute); fi
          case "$ROS_OPERATION" in
            resume) python -m pipeline.batch --resume "$ROS_BATCH_RUN_ID" "${args[@]}" ;;
            status) python -m pipeline.batch --status "$ROS_BATCH_RUN_ID" ;;
            cancel) python -m pipeline.batch --cancel "$ROS_BATCH_RUN_ID" ;;
            *) exit 1 ;;
          esac
      - name: Preserve private local diagnostics (recovery is durable in D1/R2)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pipeline/
          retention-days: 7
