name: Archive owner-selected legacy train candidates
on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: 'Remove only the five identified old train candidates from review, preserving audit and files'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  archive-legacy:
    if: ${{ github.ref == 'refs/heads/ops/archive-legacy-trains-2026-11-03' && github.event.repository.private == true && inputs.confirm_cleanup }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject only the identified legacy candidates through the existing audited API
        run: |
          python - <<'PY'
          import os,json
          from pipeline.importer import request
          base='https://real-or-slop.rickymusu.workers.dev'
          token=os.environ['REAL_OR_SLOP_ADMIN_TOKEN']
          expected={
            '7a2bc0da-d6c3-4abe-8d20-b9934548a1f8':'File:2220 Invicta at Chatham Historic Dockyard.jpg',
            '52dd6dfd-d5ba-49d2-9f6e-f212167d6905':'File:2503 Thalia at Chatham Historic Dockyard.jpg',
            '8bb52836-6895-43b5-8299-dace5f6423ad':'File:ÖBB 91-107 museum schwechat 2011-05-07.jpg',
            '85083924-fcf5-4e21-ad71-ca7aae0e60d5':'File:Паровоз Су 205-80 2005-09 фабрика Сакко и Ванцети.jpg',
            '96c65707-9371-4fad-a868-b34f93a2decc':'File:Паровоз Су 205-80 2005-09 фабрика Сакко и Ванцети 2.jpg',
          }
          pending={row['id']:row for row in request(base,token,'/api/admin/images?status=in-review')}
          rejected={row['id']:row for row in request(base,token,'/api/admin/images?status=rejected')}
          before=request(base,token,'/api/admin/editorial/state')['diagnostics']['totals']
          for uid,title in expected.items():
              row=pending.get(uid) or rejected.get(uid)
              assert row and row['title']==title and row['type']=='REAL' and row['published_at'] is None
          for uid in expected:
              if uid in pending:
                  result=request(base,token,'/api/admin/review/'+uid,'POST',dict(decision='rejected',notes='Rimosso dalla coda su richiesta del proprietario: vecchia importazione dei treni. File e cronologia conservati.'))
                  assert result['status']=='rejected'
          after=request(base,token,'/api/admin/editorial/state')['diagnostics']['totals']
          assert before==after
          print(json.dumps(dict(legacy_trains_removed_from_review=5,catalog_unchanged=True,files_preserved=True,paid_calls=False)))
          PY
