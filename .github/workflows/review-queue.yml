name: Automatic private review queue
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      reference_count:
        description: 'Maximum source photographs: 2 for the first controlled test, 20 for a normal batch'
        type: choice
        options: ['2', '20']
        default: '2'
      execute_paid:
        description: 'Explicitly authorize bounded paid evaluation/generation and private imports'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  collect-and-import:
    # The schedule is dormant until a NEW explicit owner-controlled flag is set.
    # No existing queue flag can activate paid work by itself.
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.private == true && vars.ENABLE_AUTOMATIC_REVIEW_QUEUE == 'true' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_EDITORIAL_SCHEDULE == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROS_REFERENCE_COUNT: ${{ inputs.reference_count || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Collect a bounded, diversified reference batch locally
        env:
          REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
        run: python -m pipeline.automatic --collect --limit "$ROS_REFERENCE_COUNT" --preferences
      - name: Network-free editorial plan
        run: python -m pipeline.editorial .pipeline/automatic/manifest.json
      - name: Bounded paid pipeline into private review only
        if: ${{ vars.ENABLE_EDITORIAL_PAID == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.execute_paid) || (github.event_name == 'schedule' && vars.ENABLE_EDITORIAL_SCHEDULE == 'true')) }}
        env:
          ENABLE_EDITORIAL_PAID: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
          OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL }}
          OPENAI_EVALUATOR_MODEL: ${{ vars.OPENAI_EVALUATOR_MODEL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          EDITORIAL_RUN_USD: ${{ vars.EDITORIAL_RUN_USD }}
          EDITORIAL_DAILY_USD: ${{ vars.EDITORIAL_DAILY_USD }}
          EDITORIAL_EVALUATION_USD: ${{ vars.EDITORIAL_EVALUATION_USD }}
          EDITORIAL_GENERATION_USD: ${{ vars.EDITORIAL_GENERATION_USD }}
          EDITORIAL_THRESHOLD: ${{ vars.EDITORIAL_THRESHOLD || '65' }}
          EDITORIAL_ATTEMPTS: ${{ inputs.reference_count == '2' && '1' || vars.EDITORIAL_ATTEMPTS || '2' }}
          EDITORIAL_MAX_EVALUATIONS: ${{ inputs.reference_count == '2' && '4' || vars.EDITORIAL_MAX_EVALUATIONS || '60' }}
          EDITORIAL_MAX_GENERATIONS: ${{ inputs.reference_count == '2' && '1' || vars.EDITORIAL_MAX_GENERATIONS || '20' }}
          EDITORIAL_MAX_REGENERATIONS: ${{ vars.EDITORIAL_MAX_REGENERATIONS || '10' }}
          EDITORIAL_QUEUE_LIMIT: ${{ vars.EDITORIAL_QUEUE_LIMIT || '100' }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE || '1024x1024' }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY || 'medium' }}
          GENERATED_LICENSE_NAME: ${{ vars.GENERATED_LICENSE_NAME }}
          GENERATED_LICENSE_URL: ${{ vars.GENERATED_LICENSE_URL }}
        run: python -m pipeline.automatic --apply
      - name: Preserve private recovery material (never secrets)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pipeline/automatic/
          retention-days: 7
