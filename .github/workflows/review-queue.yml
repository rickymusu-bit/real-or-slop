name: Controlled direct editorial test
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Plan/start the small direct test or check its API permissions'
        type: choice
        options: ['start', 'permissions']
        default: 'start'
      reference_count:
        description: 'Controlled pilot: maximum two source photographs and one generation'
        type: choice
        options: ['2']
        default: '2'
      execute_paid:
        description: 'Authorize direct evaluation/generation; false only collects and plans'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: real-or-slop-private-review-queue
  cancel-in-progress: false
jobs:
  collect-and-import:
    # One explicitly authorized manual pilot; no schedule or repository variable changes.
    if: ${{ github.ref == 'refs/heads/ops/batch-pilot-2026-11-02' && github.event.repository.private == true && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROS_OPERATION: ${{ inputs.operation }}
      ROS_REFERENCE_COUNT: '2'
      ROS_QUEUE_ENABLED: 'true'
      ROS_EXECUTE_PAID: ${{ inputs.execute_paid && 'true' || 'false' }}
      ENABLE_EDITORIAL_PAID: ${{ inputs.execute_paid && 'true' || 'false' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REAL_OR_SLOP_ADMIN_TOKEN: ${{ secrets.REAL_OR_SLOP_ADMIN_TOKEN }}
      OPENAI_ANALYSIS_MODEL: gpt-6.1-terra
      OPENAI_EVALUATOR_MODEL: gpt-6.1-terra
      OPENAI_IMAGE_MODEL: gpt-image-2
      EDITORIAL_RUN_USD: '5'
      EDITORIAL_DAILY_USD: '5'
      EDITORIAL_TOTAL_USD: '5'
      EDITORIAL_EVALUATION_USD: '0.50'
      EDITORIAL_GENERATION_USD: '2.00'
      EDITORIAL_THRESHOLD: '65'
      EDITORIAL_ATTEMPTS: '1'
      EDITORIAL_MAX_EVALUATIONS: '4'
      EDITORIAL_MAX_GENERATIONS: '1'
      EDITORIAL_MAX_REGENERATIONS: '1'
      EDITORIAL_QUEUE_LIMIT: '100'
      OPENAI_IMAGE_SIZE: 1024x1024
      OPENAI_IMAGE_QUALITY: medium
      GENERATED_LICENSE_NAME: CC BY 4.0
      GENERATED_LICENSE_URL: https://creativecommons.org/licenses/by/4.0/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Check OpenAI permissions without inference
        if: ${{ inputs.operation == 'permissions' }}
        run: |
          python - <<'PYPROBE'
          import os,json,re
          from urllib.request import Request,build_opener
          from urllib.error import HTTPError
          from pipeline.importer import NoRedirect
          key=os.environ.get('OPENAI_API_KEY','')
          if not key:raise SystemExit('OPENAI_API_KEY non configurata')
          probes=[('responses',b'{}','application/json'),('images/generations',b'{}','application/json')]
          for path,data,content_type in probes:
            try:
              req=Request('https://api.openai.com/v1/'+path,data=data,headers={'Authorization':'Bearer '+key,'Content-Type':content_type})
              with build_opener(NoRedirect()).open(req,timeout=30) as response:status=response.status;message=''
            except HTTPError as error:
              status=error.code
              try:message=str(json.loads(error.read(16000)).get('error',{}).get('message',''))
              except ValueError:message=''
            print(json.dumps(dict(endpoint=path,status=status,missing_scopes=sorted(set(re.findall(r'\b(?:api|model)\.[a-z_]+(?:\.[a-z_]+)*',message))),inference_submitted=False)))
          PYPROBE
      - name: Collect or inspect a new bounded lot
        if: ${{ inputs.operation == 'start' && env.ROS_QUEUE_ENABLED == 'true' }}
        run: |
          python -m pipeline.automatic --collect --limit "$ROS_REFERENCE_COUNT" --preferences
          python -m pipeline.editorial .pipeline/automatic/manifest.json
      - name: Run the bounded direct test into private review
        if: ${{ inputs.operation == 'start' && env.ROS_EXECUTE_PAID == 'true' }}
        run: |
          python - <<'PYPREFLIGHT'
          import json
          from pathlib import Path
          from pipeline.editorial import candidates,PipelineStop
          root=Path('.pipeline/automatic').resolve()
          if len(candidates(json.loads((root/'manifest.json').read_text()),root))!=2:
            raise PipelineStop('Servono due fotografie nuove per provare REAL e SLOP; nessuna chiamata a pagamento inviata')
          PYPREFLIGHT
          python -m pipeline.editorial .pipeline/automatic/manifest.json --execute --base https://real-or-slop.rickymusu.workers.dev --out .pipeline/direct-test
      - name: Prepare numeric summary artifact
        if: ${{ always() }}
        run: |
          python - <<'PYSUMMARY'
          import json
          from pathlib import Path
          source=Path('.pipeline/direct-test/summary.json')
          if source.exists():
            data=json.loads(source.read_text())
            summary={key:data[key] for key in ('ranked','real','slop','calls','reserved_usd','timestamp') if key in data}
            Path('artifacts').mkdir(exist_ok=True)
            Path('artifacts/direct-test-summary.json').write_text(json.dumps(summary))
          PYSUMMARY
      - name: Preserve sanitized direct-test summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: private-editorial-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/direct-test-summary.json
          retention-days: 7
